[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-outreach"
version = "1.0.0"
description = "Website contact-email scraper and OSM-places-to-contacts pipeline."
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.20.0",
    "pandas>=2.0.0",
]

[tool.setuptools]
packages = ["email_outreach"]
